<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Σημειώσεις">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Σημειώσεις</title>
<style>
  :root{--bg:#f6f5f2;--card:#fff;--text:#1b1c1f;--muted:#6b6f76;--accent:#d9480f;--border:#e4e2dc}
  @media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e25;--text:#eceef2;--muted:#8b919c;--accent:#ff7a3d;--border:#2a2e37}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 -apple-system,system-ui,sans-serif}
  body{min-height:100dvh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px}
  .top{display:flex;align-items:center;justify-content:space-between}
  h1{font-size:30px;margin:0;letter-spacing:-.5px}
  .ghost{background:none;border:0;color:var(--accent);font:inherit;padding:6px 4px}
  #search{width:100%;margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit}
  main{flex:1;padding:4px 16px 16px}
  .note{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;position:relative}
  .note p{margin:0 30px 6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
  .note time{font-size:13px;color:var(--muted)}
  .del{position:absolute;top:4px;right:4px;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:8px 10px}
  .empty{color:var(--muted);text-align:center;margin-top:48px}
  footer{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px)}
  #draft{display:block;width:100%;min-height:52px;max-height:40vh;resize:none;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit}
  .actions{display:flex;gap:10px;margin-top:10px;align-items:center}
  #mic{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
  #mic.on{animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,122,61,.55)}100%{box-shadow:0 0 0 18px rgba(255,122,61,0)}}
  #save{flex:1;height:52px;border-radius:12px;border:0;background:var(--text);color:var(--bg);font:600 17px -apple-system,system-ui,sans-serif}
  #save:disabled{opacity:.35}
  #cancel{display:none}
  body.editing #cancel{display:inline-block}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:15px;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Σημειώσεις</h1>
    <button class="ghost" id="export">Εξαγωγή</button>
  </div>
  <input id="search" type="search" placeholder="Αναζήτηση…" autocomplete="off">
</header>

<main id="list"></main>

<footer>
  <textarea id="draft" rows="1" placeholder="Πάτα το μικρόφωνο και μίλα…"></textarea>
  <div class="actions">
    <button id="mic" aria-label="Υπαγόρευση">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg>
    </button>
    <button id="save" disabled>Αποθήκευση</button>
    <button class="ghost" id="cancel">Άκυρο</button>
  </div>
</footer>

<div id="toast"></div>

<script>
const KEY = 'voice-notes-v1';
const $ = id => document.getElementById(id);
const list = $('list'), draft = $('draft'), mic = $('mic'), save = $('save'), search = $('search');

let notes = load();
let editingId = null;

function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch { toast('Δεν ήταν δυνατή η αποθήκευση'); } }
navigator.storage?.persist?.();

const fmt = new Intl.DateTimeFormat('el-GR', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

function render(){
  const q = norm(search.value.trim());
  const shown = notes.filter(n => !q || norm(n.text).includes(q)).sort((a,b) => b.updated - a.updated);
  list.innerHTML = shown.length
    ? shown.map(n => `<div class="note" data-id="${n.id}"><p>${esc(n.text)}</p><time>${fmt.format(n.updated)}</time><button class="del" aria-label="Διαγραφή">×</button></div>`).join('')
    : `<div class="empty">${q ? 'Δεν βρέθηκε τίποτα' : 'Καμία σημείωση ακόμα'}</div>`;
}

function autosize(){ draft.style.height = 'auto'; draft.style.height = Math.min(draft.scrollHeight, innerHeight * .4) + 'px'; save.disabled = !draft.value.trim(); }

function resetComposer(){ editingId = null; draft.value = ''; document.body.classList.remove('editing'); save.textContent = 'Αποθήκευση'; autosize(); }

save.onclick = () => {
  stopListening();
  const text = draft.value.trim();
  if (!text) return;
  const now = Date.now();
  if (editingId) {
    const n = notes.find(n => n.id === editingId);
    if (n) { n.text = text; n.updated = now; }
  } else {
    notes.push({ id: crypto.randomUUID?.() || String(now), text, created: now, updated: now });
  }
  persist(); resetComposer(); render();
};

$('cancel').onclick = () => { stopListening(); resetComposer(); };

list.onclick = e => {
  const el = e.target.closest('.note'); if (!el) return;
  const id = el.dataset.id;
  if (e.target.classList.contains('del')) {
    if (confirm('Διαγραφή σημείωσης;')) { notes = notes.filter(n => n.id !== id); persist(); if (editingId === id) resetComposer(); render(); }
    return;
  }
  const n = notes.find(n => n.id === id); if (!n) return;
  editingId = id; draft.value = n.text; document.body.classList.add('editing'); save.textContent = 'Ενημέρωση';
  autosize(); draft.focus();
};

draft.oninput = autosize;
search.oninput = render;

$('export').onclick = async () => {
  if (!notes.length) return toast('Δεν υπάρχουν σημειώσεις');
  const text = [...notes].sort((a,b) => b.updated - a.updated).map(n => `[${fmt.format(n.updated)}]\n${n.text}`).join('\n\n');
  try {
    if (navigator.share) await navigator.share({ title: 'Σημειώσεις', text });
    else { await navigator.clipboard.writeText(text); toast('Αντιγράφηκαν στο πρόχειρο'); }
  } catch {}
};

/* ---------- Υπαγόρευση ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;

function startListening(){
  if (!SR) { fallback(); return; }
  const base = draft.value.trim() ? draft.value.trimEnd() + ' ' : '';
  rec = new SR();
  rec.lang = 'el-GR';
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = e => {
    let t = '';
    for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    draft.value = base + t; autosize();
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed') toast('Δώσε άδεια μικροφώνου στις Ρυθμίσεις → Safari');
    else if (e.error !== 'no-speech' && e.error !== 'aborted') fallback();
  };
  rec.onend = () => setListening(false);
  try { rec.start(); setListening(true); } catch { fallback(); }
}
function stopListening(){ if (rec && listening) rec.stop(); setListening(false); }
function setListening(v){ listening = v; mic.classList.toggle('on', v); }
function fallback(){ setListening(false); draft.focus(); toast('Πάτα το 🎤 του πληκτρολογίου για υπαγόρευση'); }

mic.onclick = () => listening ? stopListening() : startListening();

let tt;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2800); }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
render(); autosize();
</script>
</body>
</html>
